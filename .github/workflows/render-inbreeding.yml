name: Render INBREEDING video

# Chunked cloud render of INBREEDING_RENDER (How Did Ancient Humans Avoid
# Inbreeding?): 8 matrix jobs each render a shot-aligned frame range, then a
# combine job stitches + re-encodes the final 8:58 mp4 and uploads it.
#
# The root-level render.yml (Periods video) is unaffected — different name,
# different paths, manual dispatch only.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "INBREEDING_RENDER/**"
      - ".github/workflows/render-inbreeding.yml"

concurrency:
  group: render-inbreeding-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: INBREEDING_RENDER

jobs:
  plan:
    name: Plan chunks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify assets + plan chunks
        run: |
          node scripts/verify-assets.mjs
          node scripts/plan-chunks.mjs
          cat chunks.json

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: render-plan
          path: INBREEDING_RENDER/chunks.json
          if-no-files-found: error
          retention-days: 7

  render:
    name: Render chunk ${{ matrix.chunk }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chrome dependencies (noble)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0t64 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libatk-bridge2.0-0t64 libpango-1.0-0 libcairo2 libcups2t64

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: render-plan
          path: INBREEDING_RENDER/

      - name: Install dependencies
        working-directory: INBREEDING_RENDER/video
        run: npm ci --no-audit --no-fund

      - name: Render chunk ${{ matrix.chunk }}
        env:
          CHUNK_INDEX: ${{ matrix.chunk }}
          RENDER_CONCURRENCY: "4"
        run: node scripts/render-chunk.mjs

      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk }}
          path: INBREEDING_RENDER/video/out/chunks/chunk_${{ matrix.chunk }}.mp4
          if-no-files-found: error
          retention-days: 7

  combine:
    name: Combine → final video
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: render-plan
          path: INBREEDING_RENDER/

      - name: Download chunks
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: INBREEDING_RENDER/video/out/chunks/
          merge-multiple: true

      - name: Stitch + final encode
        run: node scripts/combine-chunks.mjs

      - name: Probe final video
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of default=nw=1 video/out/final_video.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=nw=1 video/out/final_video.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 video/out/final_video.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: final-video-inbreeding
          path: INBREEDING_RENDER/video/out/final_video.mp4
          if-no-files-found: error
          retention-days: 30
