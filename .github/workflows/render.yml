name: Render video

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.calc.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: calc
        shell: bash
        run: |
          TOTAL=$(node -e "const d=require('./src/scenes.json');process.stdout.write(String(d.totalFrames))")
          Q=$(( (TOTAL + 3) / 4 ))
          MATRIX="["; FIRST=1
          for i in 0 1 2 3; do
            START=$((i * Q)); [ $START -gt $((TOTAL-1)) ] && continue
            END=$((START + Q - 1)); [ $END -gt $((TOTAL-1)) ] && END=$((TOTAL-1))
            [ $FIRST -eq 0 ] && MATRIX="$MATRIX,"
            MATRIX="$MATRIX{\"index\":$i,\"start\":$START,\"end\":$END}"; FIRST=0
          done
          MATRIX="$MATRIX]"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  render:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        chunk: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0t64 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0t64 libpango-1.0-0 libcairo2 libcups2t64
      - run: npm ci
      - name: Render chunk
        run: npx remotion render Main "chunk_${{ matrix.chunk.index }}.mp4" --frames=${{ matrix.chunk.start }}-${{ matrix.chunk.end }} --codec=h264 --crf=18 --concurrency=4 --gl=swiftshader --image-format=jpeg --jpeg-quality=95
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk.index }}
          path: chunk_${{ matrix.chunk.index }}.mp4
          if-no-files-found: error


  combine:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
          merge-multiple: true
      - name: Build ordered list
        run: ls -1 chunks/chunk_*.mp4 | sort -V | sed "s|^|file '|; s|$|'|" > chunks.txt
      - name: Concatenate
        run: ffmpeg -y -f concat -safe 0 -i chunks.txt -c copy final_video.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: food_final_video
          path: final_video.mp4
          if-no-files-found: error